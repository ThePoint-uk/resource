<style>
  /* Fluent UI design tokens — neutrals from the Fluent palette, themePrimary
     slots filled from the host site's theme (SharePoint theme tokens) */
  :root{
    --brand:#0078d4; --brand-dark:#005a9e; --brand-soft:#deecf9; --brand-softer:#eff6fc;
    --bg:#faf9f8; --panel:#ffffff;
    --text:#323130; --text-2:#605e5c; --text-3:#a19f9d;
    --border:#edebe9; --border-2:#c8c6c4;
    --radius:4px; --radius-lg:8px;
    --shadow-1:0 1.6px 3.6px rgba(0,0,0,.132), 0 0.3px 0.9px rgba(0,0,0,.108);
    --shadow-2:0 6.4px 14.4px rgba(0,0,0,.132), 0 1.2px 3.6px rgba(0,0,0,.108);
    --font:'Segoe UI','Segoe UI Web (West European)',-apple-system,BlinkMacSystemFont,sans-serif;
    --mark:#fff100;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);font-family:var(--font);color:var(--text);font-size:14px;}
  a{color:var(--brand);text-decoration:none;} a:hover{text-decoration:underline;}
  mark{background:none;color:inherit;font-weight:700;}
  button{font-family:var(--font);}
  input,select,textarea{font-family:var(--font);}
  ::placeholder{color:var(--text-3);}

  /* ---------- Suite bar ---------- */
  .suitebar{background:#0b0b0b;color:#fff;height:48px;display:flex;align-items:center;padding:0 16px;gap:14px;}
  .suitebar .waffle{font-size:20px;cursor:pointer;opacity:.9;}
  .suitebar .org{font-weight:600;font-size:15px;letter-spacing:.2px;}
  .suitebar .org span{opacity:.65;font-weight:400;}
  .suitebar .grow{flex:1;}
  .suitebar .icon-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.85;padding:6px;}
  .suitebar .me{width:30px;height:30px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;}

  /* ---------- Search hero (full width) ---------- */
  .hero{background:linear-gradient(135deg,var(--brand-dark),var(--brand));padding:26px 0 0;position:relative;}
  .hero-inner{max-width:1320px;margin:0 auto;padding:0 24px;}
  .hero h1{color:#fff;font-size:19px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:10px;}
  .hero h1 .sub{font-weight:400;font-size:13px;opacity:.75;}
  .searchwrap{position:relative;}
  .searchbox{display:flex;align-items:center;background:#fff;border-radius:4px;box-shadow:var(--shadow-1);height:52px;padding:0 8px 0 18px;gap:10px;}
  .searchbox i.lead{font-size:20px;color:var(--text-2);}
  .searchbox input{flex:1;border:none;outline:none;font-size:16px;height:100%;background:none;}
  .searchbox .kbd{border:1px solid var(--border-2);border-radius:5px;font-size:11px;padding:1px 6px;color:var(--text-3);}
  .searchbox .clear{background:none;border:none;font-size:17px;color:var(--text-3);cursor:pointer;padding:6px;display:none;}
  .searchbox .go{background:var(--brand);color:#fff;border:none;border-radius:4px;height:38px;padding:0 18px;font-size:14px;font-weight:600;cursor:pointer;}
  .searchbox .go:hover{background:var(--brand-dark);}
  .scopechip{display:flex;align-items:center;gap:6px;background:var(--brand-softer);border:1px solid var(--border);color:var(--text-2);font-size:12px;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;}

  /* suggestions dropdown */
  .suggest{position:absolute;top:58px;left:0;right:0;background:#fff;border-radius:4px;border:1px solid var(--border);box-shadow:var(--shadow-2);z-index:60;overflow:hidden;display:none;}
  .suggest.open{display:block;}
  .suggest .sec{padding:8px 0 4px;}
  .suggest .sec + .sec{border-top:1px solid var(--border);}
  .suggest .sec h4{margin:2px 16px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);}
  .suggest .row{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer;font-size:14px;}
  .suggest .row:hover,.suggest .row.active{background:var(--brand-softer);}
  .suggest .row i{font-size:16px;color:var(--text-2);width:20px;text-align:center;}
  .suggest .row .meta{color:var(--text-3);font-size:12px;margin-left:auto;white-space:nowrap;}
  .suggest .row .savatar{width:26px;height:26px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;}

  /* ---------- Vertical tabs (Fluent Pivot) ---------- */
  .verticals{background:#fff;margin-top:22px;border-bottom:1px solid var(--border);}
  .verticals .tabs{display:flex;gap:2px;max-width:1320px;margin:0 auto;padding:0 24px;overflow-x:auto;}
  .vtab{background:none;border:none;color:var(--text-2);font-size:14px;padding:11px 14px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;}
  .vtab i{font-size:16px;}
  .vtab .cnt{background:#f3f2f1;color:var(--text-2);border-radius:10px;font-size:11px;padding:1px 7px;}
  .vtab:hover{color:var(--text);background:#f3f2f1;}
  .vtab.active{color:var(--brand);font-weight:600;border-bottom-color:var(--brand);}
  .vtab.active .cnt{background:var(--brand-soft);color:var(--brand-dark);}

  /* ---------- Body layout ---------- */
  .page{max-width:1320px;margin:0 auto;padding:18px 24px 60px;}
  .statusline{display:flex;align-items:center;gap:14px;color:var(--text-2);font-size:13px;margin:2px 2px 14px;flex-wrap:wrap;}
  .statusline .grow{flex:1;}
  .sortsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);}
  .sortsel select{border:1px solid var(--border-2);border-radius:6px;padding:4px 8px;font-size:13px;background:#fff;color:var(--text);}
  .didyoumean{background:#fff;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:14px;}

  .layout{display:flex;gap:20px;align-items:flex-start;}
  .layout.filters-right{flex-direction:row-reverse;}
  .layout.filters-hidden .filters{display:none;}
  .results{flex:1;min-width:0;}

  /* ---------- Filters panel ---------- */
  .filters{width:250px;flex-shrink:0;position:sticky;top:14px;}
  .filters .fcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px 10px;margin-bottom:12px;box-shadow:var(--shadow-1);}
  .filters h3{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px;}
  .filters h3 i{font-size:15px;color:var(--brand);}
  .filters h3 .clearlink{margin-left:auto;font-size:11px;font-weight:400;cursor:pointer;color:var(--brand);}
  .fopt{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;cursor:pointer;color:var(--text);}

/* ============================================================
   SEARCH / MATCH HELPERS
   ============================================================ */
function tokens(q){return q.toLowerCase().split(/\s+/).filter(Boolean);}
function matchScore(hay,q){
  var t=tokens(q); if(!t.length) return 1;
  hay=hay.toLowerCase(); var score=0;
  for(var i=0;i<t.length;i++){ if(hay.indexOf(t[i])===-1) return 0; score+= (hay.split(t[i]).length-1); }
  return score;
}
function hi(text,q){
  var out=esc(text); var t=tokens(q);
  t.sort(function(a,b){return b.length-a.length;});
  for(var i=0;i<t.length;i++){
    var re=new RegExp('('+t[i].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'\u0001$1\u0002');
  }
  return out.split('\u0001').join('<mark>').split('\u0002').join('</mark>');
}
function fmtDate(d){
  var dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}
function relDate(d){
  var today=new Date('2026-07-26T00:00:00'); var dt=new Date(d+'T00:00:00');
  var diff=Math.round((today-dt)/86400000);
  if(diff===0) return 'Today'; if(diff===1) return 'Yesterday';
  if(diff<7) return diff+' days ago';
  return fmtDate(d);
}
function dateBucket(d){
  var today=new Date('2026-07-26T00:00:00'); var dt=new Date(d+'T00:00:00');
  var diff=(today-dt)/86400000;
  if(diff<=1) return '24h'; if(diff<=7) return 'week'; if(diff<=30) return 'month'; return 'older';
}
var SPELLFIX={'anual':'annual','buget':'budget','polcy':'policy','guildfrod':'guildford','calender':'calendar'};
function spellSuggestion(q){
  if(!state.cfg.spelling) return null;
  var t=q.toLowerCase().split(/\s+/); var changed=false;
  var fixed=t.map(function(w){ if(SPELLFIX[w]){changed=true;return SPELLFIX[w];} return w;});
  return changed?fixed.join(' '):null;
}

/* filtered result getters -------------------------------------------------- */
function fset(vk,key){ state.filters[vk]=state.filters[vk]||{}; state.filters[vk][key]=state.filters[vk][key]||new Set(); return state.filters[vk][key]; }
function fhas(vk,key,val){ var s=(state.filters[vk]||{})[key]; return s&&s.has(val); }
function factive(vk){ var f=state.filters[vk]||{}; return Object.keys(f).some(function(k){return f[k].size;}); }

function baseFiles(q){ return FILES.map(function(f){ var s=matchScore(f.name+' '+f.snippet+' '+f.site+' '+P(f.author).name+' '+FILETYPES[f.type].label,q); return s?{item:f,score:s+ (matchScore(f.name,q)?4:0)}:null; }).filter(Boolean); }
function filteredFiles(q){
  var rows=baseFiles(q).filter(function(r){
    var f=r.item;
    if(fset('files','type').size && !fhas('files','type',f.type)) return false;
    if(fset('files','source').size && !fhas('files','source',f.source)) return false;
    if(fset('files','author').size && !fhas('files','author',f.author)) return false;
    if(fset('files','date').size){ var b=dateBucket(f.modified);
      var ok=false; fset('files','date').forEach(function(sel){ if(sel==='24h'&&b==='24h')ok=true; if(sel==='week'&&(b==='24h'||b==='week'))ok=true; if(sel==='month'&&b!=='older')ok=true; });
      if(!ok) return false; }
    return true;
  });
  return sortRows(rows,'modified','name');
}
function baseMail(q){ return MAIL.map(function(m){ var s=matchScore(m.subject+' '+m.snippet+' '+P(m.from).name,q); return s?{item:m,score:s}:null; }).filter(Boolean); }
function filteredMail(q){
  var rows=baseMail(q).filter(function(r){ var m=r.item;
    if(fset('mail','from').size && !fhas('mail','from',m.from)) return false;
    if(fset('mail','attach').size && !m.attach) return false;
    if(fset('mail','date').size){ var b=dateBucket(m.date); var ok=false;
      fset('mail','date').forEach(function(sel){ if(sel==='24h'&&b==='24h')ok=true; if(sel==='week'&&(b==='24h'||b==='week'))ok=true; if(sel==='month'&&b!=='older')ok=true; });
      if(!ok) return false; }
    return true; });
  return sortRows(rows,'date','subject');
}
function baseEvents(q){ return EVENTS.map(function(e){ var s=matchScore(e.title+' '+e.location+' '+P(e.organizer).name,q); return s?{item:e,score:s}:null; }).filter(Boolean); }
function filteredEvents(q){
  var rows=baseEvents(q).filter(function(r){ var e=r.item;
    if(fset('calendar','online').size && !e.online) return false;
    if(fset('calendar','organizer').size && !fhas('calendar','organizer',e.organizer)) return false;
    return true; });
  rows.sort(function(a,b){return a.item.date<b.item.date?-1:1;});
  return rows;
}
function basePeople(q){ return PEOPLE.map(function(p){ var s=matchScore(p.name+' '+p.title+' '+p.dept+' '+p.office+' '+p.skills.join(' '),q); return s?{item:p,score:s+(matchScore(p.name,q)?4:0)}:null; }).filter(Boolean); }
function filteredPeople(q){
  var rows=basePeople(q).filter(function(r){ var p=r.item;
    if(fset('people','dept').size && !fhas('people','dept',p.dept)) return false;
    if(fset('people','office').size && !fhas('people','office',p.office)) return false;
    return true; });
  if(state.sort==='az') rows.sort(function(a,b){return a.item.name.localeCompare(b.item.name);});
  else rows.sort(function(a,b){return b.score-a.score;});
  return rows;
}
function baseSites(q){ return SITES.map(function(s0){ var s=matchScore(s0.name+' '+s0.desc+' '+s0.hub,q); return s?{item:s0,score:s}:null; }).filter(Boolean); }
function basePolicies(q){ return POLICIES.map(function(p){ var s=matchScore(p.name+' '+p.summary+' '+p.cat+' '+p.owner,q); return s?{item:p,score:s+(matchScore(p.name,q)?4:0)}:null; }).filter(Boolean); }
function filteredPolicies(q){
  var rows=basePolicies(q).filter(function(r){ var p=r.item;
    if(fset('policies','cat').size && !fhas('policies','cat',p.cat)) return false;
    if(fset('policies','status').size && !fhas('policies','status',p.status)) return false;
    return true; });
  rows.sort(function(a,b){return b.score-a.score;});
  return rows;
}
function sortRows(rows,dateField,nameField){
  if(state.sort==='newest') rows.sort(function(a,b){return a.item[dateField]<b.item[dateField]?1:-1;});
  else if(state.sort==='oldest') rows.sort(function(a,b){return a.item[dateField]>b.item[dateField]?1:-1;});
  else if(state.sort==='az') rows.sort(function(a,b){return a.item[nameField].localeCompare(b.item[nameField]);});
  else rows.sort(function(a,b){return b.score-a.score;});
  return rows;
}
function counts(q){
  return {files:filteredFiles(q).length,mail:filteredMail(q).length,calendar:filteredEvents(q).length,
          people:filteredPeople(q).length,sites:baseSites(q).length,policies:filteredPolicies(q).length};
}

function checkboxList(vk,key,items){
  var h='';
  items.forEach(function(it){
    var checked=fhas(vk,key,it.val)?' checked':'';
    h+='<label class="fopt"><input type="checkbox" class="fchk" data-vk="'+vk+'" data-key="'+key+'" data-val="'+esc(it.val)+'"'+checked+' /> '+esc(it.label)+'<span class="n">'+it.n+'</span></label>';
  });
  return h;
}
function tally(rows,fn){
  var m={}; rows.forEach(function(r){ var k=fn(r.item); if(k!=null){m[k]=(m[k]||0)+1;} }); return m;
}
function renderFilters(q){
  var v=state.vertical; var h='';
  var applied=[];
  var f=state.filters[v]||{};
  Object.keys(f).forEach(function(key){ f[key].forEach(function(val){ applied.push({key:key,val:val}); }); });
  if(applied.length){
    h+='<div class="fcard"><div class="fhead"><h3 style="margin:0"><i class="ti ti-filter"></i> Applied</h3><span class="clearlink" id="clearall">Clear all</span></div><div class="applied">';
    applied.forEach(function(a){
      var label=a.val;
      if(a.key==='author'||a.key==='from'||a.key==='organizer'){var p=P(a.val); label=p?p.name:a.val;}
      if(a.key==='attach') label='Has attachments'; if(a.key==='online') label='Online meetings';
      if(a.key==='date') label={'24h':'Past 24 hours','week':'Past week','month':'Past month'}[a.val]||a.val;
      h+='<span class="chip rmchip" data-vk="'+v+'" data-key="'+a.key+'" data-val="'+esc(a.val)+'">'+esc(label)+' <i class="ti ti-x"></i></span>';
    });
    h+='</div></div>';
  }

  if(v==='files'||v==='all'){
    var rows=baseFiles(q);
    var byType=tally(rows,function(f){return f.type;});
    var bySource=tally(rows,function(f){return f.source;});
    var byAuthor=tally(rows,function(f){return f.author;});
    h+='<div class="fcard"><h3><i class="ti ti-file"></i> File type</h3>'
      + checkboxList('files','type',Object.keys(FILETYPES).filter(function(t){return byType[t];}).map(function(t){return {val:t,label:FILETYPES[t].label,n:byType[t]};}))+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-calendar"></i> Last modified</h3>'
      + checkboxList('files','date',[{val:'24h',label:'Past 24 hours'},{val:'week',label:'Past week'},{val:'month',label:'Past month'}].map(function(d){
          var n=rows.filter(function(r){var b=dateBucket(r.item.modified);
            return d.val==='24h'?b==='24h':d.val==='week'?(b==='24h'||b==='week'):b!=='older';}).length;
          return {val:d.val,label:d.label,n:n};}))+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-database"></i> Source</h3>'
      + checkboxList('files','source',Object.keys(bySource).map(function(s){return {val:s,label:s,n:bySource[s]};}))+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-user-edit"></i> Author</h3>'
      + checkboxList('files','author',Object.keys(byAuthor).map(function(a){return {val:a,label:P(a).name,n:byAuthor[a]};}))+'</div>';
  }
  if(v==='mail'){
    var mrows=baseMail(q);
    var byFrom=tally(mrows,function(m){return m.from;});
    h+='<div class="fcard"><h3><i class="ti ti-calendar"></i> Received</h3>'
      + checkboxList('mail','date',[{val:'24h',label:'Past 24 hours'},{val:'week',label:'Past week'},{val:'month',label:'Past month'}].map(function(d){
          var n=mrows.filter(function(r){var b=dateBucket(r.item.date);
            return d.val==='24h'?b==='24h':d.val==='week'?(b==='24h'||b==='week'):b!=='older';}).length;
          return {val:d.val,label:d.label,n:n};}))+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-user"></i> From</h3>'
      + checkboxList('mail','from',Object.keys(byFrom).map(function(a){return {val:a,label:P(a).name,n:byFrom[a]};}))+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-paperclip"></i> Other</h3>'
      + checkboxList('mail','attach',[{val:'yes',label:'Has attachments',n:mrows.filter(function(r){return r.item.attach;}).length}])+'</div>';
  }
  if(v==='calendar'){
    var erows=baseEvents(q);
    var byOrg=tally(erows,function(e){return e.organizer;});
    h+='<div class="fcard"><h3><i class="ti ti-video"></i> Meeting type</h3>'
      + checkboxList('calendar','online',[{val:'yes',label:'Online (Teams)',n:erows.filter(function(r){return r.item.online;}).length}])+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-user"></i> Organiser</h3>'
      + checkboxList('calendar','organizer',Object.keys(byOrg).map(function(a){return {val:a,label:P(a).name,n:byOrg[a]};}))+'</div>';
  }
  if(v==='people'){
    var prow=basePeople(q);
    var byDept=tally(prow,function(p){return p.dept;});
    var byOff=tally(prow,function(p){return p.office;});
    h+='<div class="fcard"><h3><i class="ti ti-building"></i> Department</h3>'
      + checkboxList('people','dept',Object.keys(byDept).map(function(d){return {val:d,label:d,n:byDept[d]};}))+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-map-pin"></i> Office</h3>'
      + checkboxList('people','office',Object.keys(byOff).map(function(d){return {val:d,label:d,n:byOff[d]};}))+'</div>';
  }
  if(v==='policies'){
    var porow=basePolicies(q);
    var byCat=tally(porow,function(p){return p.cat;});
    var bySt=tally(porow,function(p){return p.status;});
    h+='<div class="fcard"><h3><i class="ti ti-category"></i> Category</h3>'
      + checkboxList('policies','cat',Object.keys(byCat).map(function(d){return {val:d,label:d,n:byCat[d]};}))+'</div>';
    h+='<div class="fcard"><h3><i class="ti ti-status-change"></i> Status</h3>'
      + checkboxList('policies','status',Object.keys(bySt).map(function(d){return {val:d,label:d,n:bySt[d]};}))+'</div>';
  }
  if(v==='sites'){
    h+='<div class="fcard"><h3><i class="ti ti-info-circle"></i> Sites</h3><div style="font-size:12.5px;color:var(--text-2);line-height:1.5;">Site results are ranked by relevance and your activity. Hub and template filters can be enabled in configuration.</div></div>';
  }
  if(v==='all'){
    h+='<div class="fcard"><h3><i class="ti ti-adjustments"></i> Tip</h3><div style="font-size:12.5px;color:var(--text-2);line-height:1.5;">Filters apply per result type. Open a tab (e.g. <b>People</b>) for that type’s dedicated filters — the panel adapts automatically.</div></div>';
  }
  return h;
}

function fileRow(f,q){
  var ft=FILETYPES[f.type];
  return '<div class="filerow openpv" data-f="'+f.id+'">'
   + '<div class="ficon" style="background:'+ft.c+'"><i class="ti '+ft.i+'"></i></div>'
   + '<div class="fmain">'
   +   '<p class="fname">'+hi(f.name,q)+'</p>'
   +   '<div class="fmeta"><b>'+esc(f.path)+'</b> · Modified '+relDate(f.modified)+' by '+esc(P(f.author).name)+' · '+f.size
   +   (f.source==='OneDrive'?' <span class="badge grey"><i class="ti ti-cloud"></i> OneDrive</span>':'')+'</div>'
   +   '<p class="fsnippet">'+hi(f.snippet,q)+'</p>'
   + '</div>'
   + '<div class="fact">'
   +   (state.cfg.previews?'<button class="iconbtn openpv" data-f="'+f.id+'" title="Preview"><i class="ti ti-eye"></i></button>':'')
   +   '<button class="iconbtn doshare" data-f="'+f.id+'" title="Share"><i class="ti ti-share-3"></i></button>'
   +   '<button class="iconbtn docopy" data-f="'+f.id+'" title="Copy link"><i class="ti ti-link"></i></button>'
   + '</div></div>';
}

/* ============================================================
   RENDER — results per vertical
   ============================================================ */
function seeAll(vk,label){ return '<span class="seeall govert" data-v="'+vk+'">See all '+label+' <i class="ti ti-arrow-right"></i></span>'; }
function shownCount(vk){ return state.shown[vk]||state.cfg.pageSize; }
function loadMoreBtn(vk,total){
  if(shownCount(vk)>=total) return '';
  return '<button class="loadmore" data-lm="'+vk+'">Show more ('+(total-shownCount(vk))+' remaining) <i class="ti ti-chevron-down"></i></button>';
}
function answerCard(q){
  var t=q.toLowerCase();
  if(t.indexOf('leave')>-1||t.indexOf('holiday')>-1){
    return '<div class="card answer"><span class="tag"><i class="ti ti-bookmark"></i> PROMOTED RESULT</span>'
     + '<h3>Book annual leave in MyHR</h3>'
     + '<p>Colleagues book annual leave through <b>MyHR → My Time → Request leave</b>. Requests need line-manager approval and at least two weeks’ notice. Up to five days can be carried over with approval.</p>'
     + '<div class="actions"><button class="btn primary"><i class="ti ti-external-link"></i> Open MyHR</button>'
     + '<button class="btn sec openpv" data-f="f1"><i class="ti ti-eye"></i> View policy</button></div></div>';
  }
  if(t.indexOf('it')===0||t.indexOf('password')>-1||t.indexOf('ticket')>-1){
    return '<div class="card answer"><span class="tag"><i class="ti ti-bookmark"></i> PROMOTED RESULT</span>'
     + '<h3>Need IT help?</h3><p>Raise a ticket in the IT portal or call the service desk on <b>x4100</b>. Password resets are self-service via aka.ms/sspr.</p>'
     + '<div class="actions"><button class="btn primary"><i class="ti ti-external-link"></i> IT Self-Service Portal</button></div></div>';
  }
  return '';
}
function renderResults(q,c,total){
  var v=state.vertical; var h='';
  if(total===0){
    return '<div class="empty"><i class="ti ti-search-off"></i><h3>No results for “'+esc(q)+'”</h3>'
     + '<p>Check the spelling, try fewer keywords, or widen the scope from “'+esc(state.cfg.scope)+'”.</p></div>';
  }
  if(v==='all'){
    h+=answerCard(q);
    var pr=filteredPeople(q).slice(0,4);
    if(pr.length && state.cfg.verticals.people){
      h+='<div class="rsec"><h2><i class="ti ti-users"></i> People'+seeAll('people','people')+'</h2><div class="pplstrip">';
      pr.forEach(function(r,i){h+=personCard(r.item,q,i);}); h+='</div></div>';
    }
    var fr=filteredFiles(q).slice(0,4);
    if(fr.length && state.cfg.verticals.files){
      h+='<div class="rsec"><h2><i class="ti ti-files"></i> Files'+seeAll('files','files')+'</h2><div class="card rlist">';
      fr.forEach(function(r){h+=fileRow(r.item,q);}); h+='</div></div>';
    }
    var po=filteredPolicies(q).slice(0,2);
    if(po.length && state.cfg.verticals.policies){
      h+='<div class="rsec"><h2><i class="ti ti-shield-check"></i> Policies'+seeAll('policies','policies')+'</h2><div class="card rlist">';
      po.forEach(function(r){h+=policyRow(r.item,q);}); h+='</div></div>';
    }
    var mr=filteredMail(q).slice(0,3);
    if(mr.length && state.cfg.verticals.mail){
      h+='<div class="rsec"><h2><i class="ti ti-mail"></i> Mail'+seeAll('mail','mail')+'</h2><div class="card rlist">';
      mr.forEach(function(r){h+=mailRow(r.item,q);}); h+='</div></div>';
    }
    var er=filteredEvents(q).slice(0,2);
    if(er.length && state.cfg.verticals.calendar){
      h+='<div class="rsec"><h2><i class="ti ti-calendar-event"></i> Calendar'+seeAll('calendar','events')+'</h2><div class="card rlist">';
      er.forEach(function(r){h+=calRow(r.item,q);}); h+='</div></div>';
    }
    var sr=baseSites(q).slice(0,2);
    if(sr.length && state.cfg.verticals.sites){
      h+='<div class="rsec"><h2><i class="ti ti-world"></i> Sites'+seeAll('sites','sites')+'</h2><div class="sitegrid">';
      sr.forEach(function(r){h+=siteCard(r.item,q);}); h+='</div></div>';
    }
    return h;
  }
  if(v==='files'){
    var rows=filteredFiles(q); var n=shownCount('files');
    if(!rows.length) return emptyVert('files');
    h+='<div class="card rlist">'; rows.slice(0,n).forEach(function(r){h+=fileRow(r.item,q);}); h+='</div>'+loadMoreBtn('files',rows.length);
    return h;
  }
  if(v==='mail'){
    var rows2=filteredMail(q); var n2=shownCount('mail');
    if(!rows2.length) return emptyVert('mail');
    h+='<div class="card rlist">'; rows2.slice(0,n2).forEach(function(r){h+=mailRow(r.item,q);}); h+='</div>'+loadMoreBtn('mail',rows2.length);
    return h;
  }
  if(v==='calendar'){
    var rows3=filteredEvents(q);
    if(!rows3.length) return emptyVert('calendar');
    h+='<div class="card rlist">'; rows3.forEach(function(r){h+=calRow(r.item,q);}); h+='</div>';
    return h;
  }
  if(v==='people'){
    var rows4=filteredPeople(q);
    if(!rows4.length) return emptyVert('people');
    var byDept=tally(basePeople(q),function(p){return p.dept;});
    h+='<div class="deptchips"><span class="chip'+(!fset('people','dept').size?' active':'')+' deptchip" data-d="">All departments</span>';
    Object.keys(byDept).forEach(function(d){
      h+='<span class="chip'+(fhas('people','dept',d)?' active':' ghost')+' deptchip" data-d="'+esc(d)+'">'+esc(d)+' ('+byDept[d]+')</span>';
    });
    h+='</div><div class="pplgrid">';
    rows4.forEach(function(r,i){h+=personCard(r.item,q,i);}); h+='</div>';
    return h;
  }
  if(v==='sites'){
    var rows5=baseSites(q);
    if(!rows5.length) return emptyVert('sites');
    h+='<div class="sitegrid">'; rows5.forEach(function(r){h+=siteCard(r.item,q);}); h+='</div>';
    return h;
  }
  if(v==='policies'){
    var rows6=filteredPolicies(q);
    if(!rows6.length) return emptyVert('policies');
    h+='<div class="card rlist">'; rows6.forEach(function(r){h+=policyRow(r.item,q);}); h+='</div>';
    return h;
  }
  return h;
}
function emptyVert(vk){
  var lbl=VERTICALS.find(function(v){return v.key===vk;}).label.toLowerCase();
  return '<div class="empty"><i class="ti ti-filter-off"></i><h3>No '+lbl+' match</h3><p>Try removing a filter or searching different keywords.</p></div>';
}

/* ============================================================
   SUGGESTIONS
   ============================================================ */
function renderSuggest(q){
  var el=document.getElementById('suggest');
  if(!state.cfg.suggestions||!q){el.classList.remove('open');return;}
  var h=''; suggestIdx=-1;
  var qs=TRENDING.concat(RECENT).filter(function(t){return t.indexOf(q.toLowerCase())>-1&&t!==q.toLowerCase();}).slice(0,3);
  if(qs.length){
    h+='<div class="sec"><h4>Suggested searches</h4>';
    qs.forEach(function(t){h+='<div class="row srow" data-q="'+esc(t)+'"><i class="ti ti-search"></i>'+hi(t,q)+'</div>';});
    h+='</div>';
  }
  var pp=basePeople(q).slice(0,2);
  if(pp.length){
    h+='<div class="sec"><h4>People</h4>';
    pp.forEach(function(r){var p=r.item;
      h+='<div class="row prow openperson" data-p="'+p.id+'"><span class="savatar" style="background:'+av(PEOPLE.indexOf(p))+'">'+initials(p.name)+'</span>'+hi(p.name,q)+'<span class="meta">'+esc(p.title)+'</span></div>';});
    h+='</div>';
  }
  var ff=baseFiles(q).slice(0,3);
  if(ff.length){
    h+='<div class="sec"><h4>Files</h4>';
    ff.forEach(function(r){var f=r.item;var ft=FILETYPES[f.type];
      h+='<div class="row frow openpv" data-f="'+f.id+'"><i class="ti '+ft.i+'" style="color:'+ft.c+'"></i>'+hi(f.name,q)+'<span class="meta">'+relDate(f.modified)+'</span></div>';});
    h+='</div>';
  }
  if(!h){el.classList.remove('open');return;}
  el.innerHTML=h; el.classList.add('open');
  el.querySelectorAll('.srow').forEach(function(r){ r.addEventListener('mousedown',function(ev){ev.preventDefault(); doSearch(r.getAttribute('data-q'));}); });
  el.querySelectorAll('.prow').forEach(function(r){ r.addEventListener('mousedown',function(ev){ev.preventDefault(); el.classList.remove('open'); openPerson(r.getAttribute('data-p'),ev);}); });
  el.querySelectorAll('.frow').forEach(function(r){ r.addEventListener('mousedown',function(ev){ev.preventDefault(); el.classList.remove('open'); openPreview(r.getAttribute('data-f'));}); });
}

function shade(hex,pct){
  var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  var f=function(c){ return Math.round(pct<0? c*(1+pct) : c+(255-c)*pct); };
  return '#'+[f(r),f(g),f(b)].map(function(c){return c.toString(16).padStart(2,'0');}).join('');
}

function doSearch(q){
  state.query=q; state.shown={}; state.filters={};
  render();
  var inp=document.getElementById('qinput'); if(inp){inp.focus(); inp.setSelectionRange(q.length,q.length);}
}
function wireShell(){
  var inp=document.getElementById('qinput');
  var typingTimer;
  inp.addEventListener('input',function(){
    document.getElementById('qclear').style.display=inp.value?'block':'none';
    renderSuggest(inp.value.trim());
    clearTimeout(typingTimer);
    typingTimer=setTimeout(function(){ if(inp.value.trim()!==state.query){ state.query=inp.value.trim(); state.shown={}; state.filters={};
      var v=inp.value; render(); var i2=document.getElementById('qinput'); i2.focus(); i2.setSelectionRange(v.length,v.length); renderSuggest(v.trim()); } },420);
  });
  inp.addEventListener('keydown',function(e){
    var sug=document.getElementById('suggest');
    var rows=sug.classList.contains('open')?Array.prototype.slice.call(sug.querySelectorAll('.row')):[];
    if(e.key==='ArrowDown'&&rows.length){e.preventDefault();suggestIdx=Math.min(rows.length-1,suggestIdx+1);rows.forEach(function(r,i){r.classList.toggle('active',i===suggestIdx);});}
    else if(e.key==='ArrowUp'&&rows.length){e.preventDefault();suggestIdx=Math.max(0,suggestIdx-1);rows.forEach(function(r,i){r.classList.toggle('active',i===suggestIdx);});}
    else if(e.key==='Enter'){
      if(suggestIdx>-1&&rows[suggestIdx]){rows[suggestIdx].dispatchEvent(new MouseEvent('mousedown'));}
      else{doSearch(inp.value.trim());}
      sug.classList.remove('open');
    }
    else if(e.key==='Escape'){sug.classList.remove('open');}
  });
  inp.addEventListener('blur',function(){setTimeout(function(){var s=document.getElementById('suggest');if(s)s.classList.remove('open');},180);});
  document.getElementById('qgo').onclick=function(){doSearch(inp.value.trim());};
  document.getElementById('qclear').onclick=function(){doSearch('');};

  document.querySelectorAll('.vtab').forEach(function(t){t.onclick=function(){state.vertical=t.getAttribute('data-v');state.shown={};render();};});
  document.querySelectorAll('.govert').forEach(function(t){t.onclick=function(){state.vertical=t.getAttribute('data-v');state.shown={};render();window.scrollTo({top:0,behavior:'smooth'});};});
  document.querySelectorAll('.trendq').forEach(function(t){t.onclick=function(){doSearch(t.getAttribute('data-q'));};});
  var dym=document.getElementById('dymlink'); if(dym){dym.onclick=function(e){e.preventDefault();doSearch(spellSuggestion(state.query));};}
  var ss=document.getElementById('sortsel'); if(ss){ss.onchange=function(e){state.sort=e.target.value;render();};}
  var fp=document.getElementById('fpostoggle'); if(fp){fp.onclick=function(){
    state.cfg.filterPos=state.cfg.filterPos==='left'?'right':'left';render();toast('Filter panel moved to the '+state.cfg.filterPos);};}

  document.querySelectorAll('.fchk').forEach(function(c){c.onchange=function(){
    var s=fset(c.getAttribute('data-vk'),c.getAttribute('data-key'));
    var val=c.getAttribute('data-val');
    if(c.checked)s.add(val);else s.delete(val);
    state.shown={};render();
  };});
  document.querySelectorAll('.rmchip').forEach(function(c){c.onclick=function(){
    fset(c.getAttribute('data-vk'),c.getAttribute('data-key')).delete(c.getAttribute('data-val'));render();
  };});
  var ca=document.getElementById('clearall'); if(ca){ca.onclick=function(){state.filters[state.vertical]={};render();};}
  document.querySelectorAll('.deptchip').forEach(function(c){c.onclick=function(){
    var d=c.getAttribute('data-d'); var s=fset('people','dept');
    if(!d){s.clear();}else if(s.has(d)){s.delete(d);}else{s.add(d);}
    render();
  };});
  document.querySelectorAll('[data-lm]').forEach(function(b){b.onclick=function(){
    var vk=b.getAttribute('data-lm'); state.shown[vk]=shownCount(vk)+state.cfg.pageSize; render();
  };});

  document.querySelectorAll('.openpv').forEach(function(r){r.addEventListener('click',function(e){
    if(e.target.closest('.doshare')||e.target.closest('.docopy'))return;
    if(!state.cfg.previews){toast('Previews are disabled in configuration');return;}
    e.stopPropagation(); openPreview(r.getAttribute('data-f'));
  });});
  document.querySelectorAll('.doshare').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();openShare(b.getAttribute('data-f'));});});
  document.querySelectorAll('.docopy').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();
    var f=FILES.find(function(x){return x.id===b.getAttribute('data-f');}); if(f)copyLink(f); else toast('Link copied');});});
  document.querySelectorAll('.openperson').forEach(function(r){r.addEventListener('click',function(e){
    if(e.target.closest('.actcall')||e.target.closest('.actteams')||e.target.closest('.actmail'))return;
    e.stopPropagation(); openPerson(r.getAttribute('data-p'),e);
  });});
  document.querySelectorAll('.actcall').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();
    var p=P(b.getAttribute('data-p')); toast('Calling '+p.name+' on '+p.phone+' (tel: link in production)');});});
  document.querySelectorAll('.actteams').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();
    var p=P(b.getAttribute('data-p')); toast('Opening Teams chat with '+p.name); });});
  document.querySelectorAll('.actmail').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();
    var p=P(b.getAttribute('data-p')); toast('New email to '+p.email);});});
  document.querySelectorAll('.joinbtn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();toast('Joining Teams meeting (mock)');});});
}

document.getElementById('gearbtn').onclick=openCfg;
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault(); var i=document.getElementById('qinput'); if(i)i.focus();
  }
  if(e.key==='Escape'){closeOverlays();}
});

/* boot with a demo query so the page opens populated */
state.query='annual leave';
render();
})();
</script>
</body>
</html>
